<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<rect width="900" height="560" fill="#f7f9f8"/>
<text x="40" y="52" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="700" fill="#16261f">SSH key pair: 개인키와 공개키</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245a4a"/></marker></defs>
<rect x="40" y="120" width="330" height="150" rx="8" fill="white" stroke="#bacbc3" stroke-width="2"/>
<text x="205.0" y="160" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">로컬: id_ed25519_jetson</text>
<text x="205.0" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">개인키</text>
<text x="205.0" y="228" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">Passphrase + ssh-agent</text>
<rect x="530" y="120" width="330" height="150" rx="8" fill="white" stroke="#bacbc3" stroke-width="2"/>
<text x="695.0" y="160" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">Jetson: authorized_keys</text>
<text x="695.0" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">공개키 (.pub)</text>
<text x="695.0" y="228" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">접속을 허용하는 키</text>
<path d="M375,335 L525,335" stroke="#245a4a" stroke-width="3" marker-end="url(#a)"/>
<text x="450.0" y="323.0" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#245a4a">인증</text>
<text x="40" y="475" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#455c50">.pub 공개키 파일만 Jetson에 등록합니다.</text>
<text x="40" y="505" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#455c50">Host key는 서버 확인용입니다. 첫 접속 때 비교합니다.</text>
<text x="40" y="535" font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#455c50">Tailscale 로그인과 SSH 키 인증은 별개의 단계입니다.</text>
</svg>