<text x="465.0" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">로봇 이동 속도</text>
<rect x="650" y="120" width="210" height="150" rx="8" fill="white" stroke="#bacbc3" stroke-width="2"/>
