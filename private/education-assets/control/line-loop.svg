<text x="755.0" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">Encoder PID</text>
<rect x="310" y="330" width="300" height="100" rx="8" fill="white" stroke="#bacbc3" stroke-width="2"/>
