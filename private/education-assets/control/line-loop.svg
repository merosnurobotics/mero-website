<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245a4a"/></marker></defs>
<rect x="40" y="120" width="240" height="150" rx="8" fill="white" stroke="#bacbc3" stroke-width="2"/>
<text x="160.0" y="160" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">기준 line</text>
<text x="160.0" y="194" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">− 추정 위치</text>
<text x="160.0" y="228" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#16261f">횡방향 오차</text>
